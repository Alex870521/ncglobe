# 發佈:推 v* 標籤(版本要和 pyproject.toml 一致)→ 在三個平台建執行檔 → 發佈到 npm 與 GitHub Releases。
# npm 用 Trusted Publishing(OIDC),不需要 token:四個套件在 npmjs.com 都設了 Trusted Publisher = 這個 repo 的 release.yml。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: windows-latest, platform: win32-x64 }
    runs-on: ${{ matrix.os }}
    env: { PYTHONUTF8: '1' }   # Windows 預設 cp1252:建置腳本與 ncglobe 的中文訊息才印得出來
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: python -m pip install -e ".[build,dev]"
      - name: Tests
        if: matrix.platform == 'darwin-arm64'
        run: python -m pytest -q
      - name: Coastline data (GSHHG l/i/h are bundled)
        run: ncglobe --install-gshhg
      - name: Executable + npm platform package
        run: |
          python scripts/build_exe.py --onedir
          python scripts/build_npm.py --platform-only
      - name: macOS app
        if: runner.os == 'macOS'
        run: |
          python scripts/build_exe.py --app
          ditto -c -k --keepParent dist/ncglobe.app "dist/ncglobe-macos-${{ matrix.platform == 'darwin-arm64' && 'arm64' || 'x64' }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            dist/npm/*.tgz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }   # id-token:npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: 'https://registry.npmjs.org' }   # Trusted Publishing 要 npm ≥ 11.5.1
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VER" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject v$VER"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Main npm package
        run: python scripts/build_npm.py --main-only darwin-arm64 darwin-x64 win32-x64
      - name: GitHub Release (npm tarballs attached, so they can be published by hand if npm fails)
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/npm/*.tgz --title "ncglobe $VER" --generate-notes
      - name: Publish to npm (platform packages first)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for f in dist/npm/alex870521-ncglobe-*-*.tgz; do npm publish "$f" --access public; done
          npm publish "dist/npm/ncglobe-$VER.tgz" --access public
