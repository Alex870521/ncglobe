[project]
name = "ncglobe"
version = "0.1.0"
description = "Browser viewer for NetCDF/HDF files: folders, slices, satellite L2 swaths, composites and a rotating globe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chih-Yu Chan" }]
keywords = ["netcdf", "hdf", "satellite", "sentinel-5p", "tropomi", "modis", "gems", "viewer", "globe"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "matplotlib>=3.8",
    "cartopy>=0.23",
    "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/Alex870521/ncglobe"
Issues = "https://github.com/Alex870521/ncglobe/issues"

[project.optional-dependencies]
# 手冊截圖用;1.62 對應本機已下載的 Chromium(版本不同要先 playwright install)
docs = ["playwright==1.62.0"]
dev = ["pytest>=8"]
# 單一執行檔與 npm 套件:scripts/build_exe.py、scripts/build_npm.py
build = ["pyinstaller>=6.10", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'", "pyobjc-framework-WebKit>=10; sys_platform == 'darwin'"]

[project.scripts]
ncglobe = "ncglobe.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncglobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# netCDF4 內部對 numpy 2.5 的棄用提醒,不是我們的程式
filterwarnings = ["ignore:Setting the shape on a NumPy array:DeprecationWarning"]
